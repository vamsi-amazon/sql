task analyticsCompatibilityReport {
    description = "Generates a markdown coverage report classifying analyticsCompatibilityTest " +
            "failures by exception type, with messages normalized so per-index/per-field " +
            "variations collapse into a single bucket. Each bucket is annotated with an Origin " +
            "(SQL plugin / analytics engine / Calcite library / OpenSearch / Test) recovered from " +
            "the cluster log's first server-side stack frame."
    group = "verification"
    dependsOn analyticsCompatibilityTest

    def xmlDir = file("$buildDir/test-results/analyticsCompatibility")
    def reportDir = file("$buildDir/reports/analytics-compatibility")
    def reportFile = file("$reportDir/REPORT.md")
    // Cluster log path. The cluster's testcluster log is the only source of server-side stack
    // traces — the SQL plugin's REST formatter only sends `type` + `reason` + `details` to the
    // client, never the throw-site frame. We need the frame to classify whether a failure is
    // from our SQL plugin's Calcite layer, the analytics-engine, the Calcite library itself, or
    // OpenSearch core. Override with -PclusterLog=/abs/path/to/cluster.log.
    //
    // Probes both common locations: the SQL plugin's own integTest-0 cluster (used when
    // `:opensearch-sql-plugin:run` brings the cluster up locally), and OpenSearch's runTask-0
    // cluster (used when the OpenSearch repo brings the cluster up).
    def clusterLog = project.findProperty('clusterLog') ?: {
        ['plugin/build/testclusters/integTest-0/logs/integTest.log',
         '../OpenSearch/build/testclusters/runTask-0/logs/runTask.log'].collect {
            file("${rootDir}/${it}")
        }.find { it.exists() }?.absolutePath
    }()

    // No inputs/outputs declared on purpose: the upstream test task is gated on
    // -Dtests.rest.cluster and may produce no XMLs. Up-to-date checks would
    // suppress the "no results" log line we want users to see.
    doLast {
        if (!xmlDir.exists()) {
            logger.lifecycle("[analyticsCompatibilityReport] No test results at ${xmlDir}; nothing to report.")
            return
        }
        reportDir.mkdirs()

        // Collapse variable text so similar errors land in one bucket. E.g.
        //   "No backend can scan all requested fields on index [opensearch-sql_test_index_bank]"
        //   "No backend can scan all requested fields on index [opensearch-sql_test_index_account]"
        // both normalize to:
        //   "No backend can scan all requested fields on index [<INDEX>]"
        Closure normalize = { String s ->
            if (s == null) return ''
            String n = s
            n = n.replaceAll(/(?i)on index \[[^\]]+\]/, 'on index [<INDEX>]')
            n = n.replaceAll(/(?i)index \[[^\]]+\]/, 'index [<INDEX>]')
            n = n.replaceAll(/Field \[[^\]]+\]/, 'Field [<FIELD>]')
            n = n.replaceAll(/Field '[^']+'/, "Field '<FIELD>'")
            n = n.replaceAll(/Table '[^']+'/, "Table '<TABLE>'")
            n = n.replaceAll(/Line \d+, Column \d+/, 'Line <L>, Column <C>')
            return n
        }

        // ---- Out-of-scope filter ----------------------------------------
        // Tests in these classes — or whose failure message contains any of these substrings —
        // are excluded from pass-rate totals (both numerator AND denominator). They're listed
        // in a separate "Out of scope" section so a reader sees what was filtered and why.
        // Reason: we deliberately don't plan to support these surfaces on the analytics-engine
        // route, so they shouldn't drag the headline pass-rate number.
        Set<String> OUT_OF_SCOPE_CLASSES = new java.util.LinkedHashSet<>([
            'org.opensearch.sql.calcite.remote.CalciteExplainIT',
            // Features not in initial-phase scope (relevance scoring, highlighting, nested
            // fields). Listed here defensively — the analytics filter currently only includes
            // `calcite.remote.*IT` + `ppl.*IT`, so these sql.* classes don't actually run today.
            'org.opensearch.sql.sql.ScoreQueryIT',
            'org.opensearch.sql.sql.HighlightFunctionIT',
            'org.opensearch.sql.sql.NestedIT',
            // expand / mvexpand operate on nested arrays; not in initial-phase scope.
            'org.opensearch.sql.calcite.remote.CalciteExpandCommandIT',
            'org.opensearch.sql.calcite.remote.CalciteMvExpandCommandIT',
            // Whole-class feature exclusions: not planning to support on analytics-engine.
            'org.opensearch.sql.calcite.remote.CalciteAliasFieldAggregationIT',
            'org.opensearch.sql.calcite.remote.CalciteGeoPointFormatsIT',
            'org.opensearch.sql.calcite.remote.CalcitePPLNestedAggregationIT',
            // Commands not in initial-phase scope on analytics-engine.
            'org.opensearch.sql.calcite.remote.CalciteMvCombineCommandIT',          // mvcombine
            'org.opensearch.sql.calcite.remote.CalciteTransposeCommandIT',          // transpose
            'org.opensearch.sql.calcite.remote.CalciteNoMvCommandIT',               // nomv
            'org.opensearch.sql.calcite.remote.CalcitePPLGraphLookupIT',            // graphlookup
            'org.opensearch.sql.calcite.remote.CalciteHighlightIT',                 // highlight
            'org.opensearch.sql.calcite.remote.CalciteFlattenCommandIT',            // flatten
            'org.opensearch.sql.calcite.remote.CalciteFlattenDocValueIT',           // flatten (docvalue variant)
            'org.opensearch.sql.calcite.remote.CalciteTrendlineCommandIT',          // trendline
            'org.opensearch.sql.calcite.remote.CalcitePPLTrendlineIT',              // trendline (PPL variant)
            'org.opensearch.sql.calcite.remote.CalciteConvertCommandIT',            // convert command
            'org.opensearch.sql.ppl.ConvertCommandIT',                              // convert command (legacy parent, not deduped)
            // Functions not in initial-phase scope on analytics-engine.
            'org.opensearch.sql.calcite.remote.CalcitePPLCryptographicFunctionIT',  // crypto
            'org.opensearch.sql.calcite.remote.CalciteIPFunctionsIT',               // IP functions (cidr, etc.)
            'org.opensearch.sql.calcite.remote.CalciteIPComparisonIT',              // IP comparisons
            'org.opensearch.sql.calcite.remote.CalcitePPLIPFunctionIT',             // IP functions (PPL variant)
            'org.opensearch.sql.calcite.remote.CalciteGeoIpFunctionsIT',            // geo-IP enrichment (lower priority)
            // Aggregate suite of in-progress new commands — covered piecemeal by the
            // per-command ITs (parse, rex, patterns, …) that already feed the report.
            'org.opensearch.sql.calcite.remote.CalciteNewAddedCommandsIT',
            // Commands deferred on the analytics-engine route.
            'org.opensearch.sql.calcite.remote.CalcitePPLJoinIT',                    // join (deferred)
            'org.opensearch.sql.calcite.remote.CalciteStreamstatsCommandIT',         // streamstats (deferred)
            'org.opensearch.sql.calcite.remote.CalciteSearchCommandIT',              // search command (deferred)
            // PPL explain — meta-feature, mirrors the already-excluded CalciteExplainIT.
            'org.opensearch.sql.calcite.remote.CalcitePPLExplainIT',
            // describe — wires to PPL_MAPPINGS_ODFE_SYS_TABLE pseudo-table that isn't registered
            // in the analytics-engine catalog; meta-feature, mirrors CalciteExplainIT.
            'org.opensearch.sql.calcite.remote.CalciteDescribeCommandIT',
            // Error-report-stage feature (structured JSON error context/location/code) not wired
            // on the analytics route — entire class tests that surface.
            'org.opensearch.sql.calcite.remote.CalciteErrorReportStageIT',
            // fetch_size pagination not honored on the analytics route (engine returns full
            // result set instead of the requested page).
            'org.opensearch.sql.ppl.FetchSizeIT'
            // NOTE: patterns / parse / rex / grok are IN scope on analytics-engine.
            //   CalcitePPLPatternsIT, CalcitePPLDashboardPatternsIT, CalciteParseCommandIT,
            //   CalcitePPLParseIT, CalciteRexCommandIT, CalcitePPLGrokIT — keep them in the
            //   pass-rate denominator.
        ])
        // Each entry: [substring_to_match_in_message_or_body, human_reason]
        // The matcher does a simple substring check; entries should be unique-enough text fragments.
        List<List<String>> OUT_OF_SCOPE_MESSAGE_PATTERNS = [
            ['LogicalGraphLookup', 'analytics-engine does not plan to support LogicalGraphLookup'],
            // mvmap / transform are deferred — exclude their "No backend supports scalar function"
            // misses so they don't dominate the stability bucket on the analytics-engine route.
            ['No backend supports scalar function [transform] among [datafusion]', 'transform / mvmap scalar functions deferred (lower priority on analytics engine)'],
            ['No backend supports scalar function [reduce] among [datafusion]', 'reduce scalar function deferred (lower priority on analytics engine — same family as transform/mvmap)'],
            // AE planner gap on correlated subqueries — Sort rule doesn't know how to handle a
            // LogicalCorrelate child. Excluded until the rule learns to mark the child node.
            ['Sort rule encountered unmarked child [LogicalCorrelate]', 'AE planner: Sort rule cannot handle LogicalCorrelate child (correlated-subquery gap)'],
            // mvappend uses ANY-typed lambdas that can't lower to Substrait — same family as
            // mvexpand / mvcombine (class-excluded). Pattern is currently unique to the 4 failing
            // CalciteMVAppendFunctionIT tests; the other 11 in that class measure mvappend basics
            // that work on the analytics path and stay in the denominator.
            ['Unable to convert the type ANY', 'mvappend ANY-typed lambda (lower priority on analytics engine — same family as transform/mvmap/reduce)'],
            // Negative tests in CalcitePPLBasicIT.testInvalidTable / CalcitePPLPluginIT that
            // intentionally query a non-existent index and assert the V2-style error
            // ("no such index [X]") fail on the analytics route because the engine throws
            // CalciteException("Table 'X' not found") instead — divergent error semantics.
            ["Table 'unknown' not found", 'negative-test asserts V2 error message; analytics route uses Calcite-style "Table ... not found"'],
            ["Table 'non_exist_index' not found", 'negative-test asserts V2 error message; analytics route uses Calcite-style "Table ... not found"'],
            // Per-doc DELETE not supported on parquet-backed indices by design — drop tests that
            // happen to issue one (composite/parquet has no row-delete primitive).
            ['delete operation not supported', 'DELETE /_doc not supported on parquet-backed indices (composite format has no row-delete primitive)'],
            // Metadata-field projection/where (e.g. fields _id, _index, _source). Not planned.
            ['Field [_id]',     'metadata field _id (not planning to support on analytics engine)'],
            ['Field [_index]',  'metadata field _index (not planning to support on analytics engine)'],
            ['Field [_source]', 'metadata field _source (not planning to support on analytics engine)'],
            // Alias-mapping fields (e.g. CalciteDataTypeIT.test_alias_data_type, scattered uses).
            ['Field [alias_',     'alias-typed field (not planning to support on analytics engine)'],
            ['Field [value_alias]', 'alias-typed field (not planning to support on analytics engine)'],
            ['Field [@timestamp]',  'alias-typed @timestamp field (not planning to support on analytics engine)'],
            // geo_point fields scattered across non-pure-geo IT classes.
            ['Field [location]',           'geo_point field (not planning to support on analytics engine)'],
            ['Field [point]',              'geo_point field (not planning to support on analytics engine)'],
            ['Field [multiple_offices]',   'geo_point field (not planning to support on analytics engine)'],
            ['Field [nested_locations]',   'geo_point field (not planning to support on analytics engine)'],
            // Nested-object field paths (dotted) across non-pure-nested IT classes — by index root.
            ['Field [address.',  'nested-object field path (not planning to support on analytics engine)'],
            ['Field [address]',  'nested-object root (not planning to support on analytics engine)'],
            ['Field [author.',   'nested-object field path (not planning to support on analytics engine)'],
            ['Field [projects.', 'nested-object field path (not planning to support on analytics engine)'],
            ['Field [comment.',  'nested-object field path (not planning to support on analytics engine)'],
            ['Field [skills.',   'nested-object field path (not planning to support on analytics engine)'],
            ['Field [machine.os', 'nested-object field path (not planning to support on analytics engine)'],
            ['Field [aws]',      'nested-object root (not planning to support on analytics engine)'],
            ['Field [agent]',    'nested-object root (not planning to support on analytics engine)'],
            ['Field [log]',      'nested-object root (not planning to support on analytics engine)'],
            // TestUtils.AnalyticsIndexConfig.applyIndexCreationSettings rewrites composite-
            // incompatible mappings before PUT: `nested` is demoted to implicit `object` (sub-paths
            // stay resolvable on parquet), `alias` is dropped. Tests that query an aliased field
            // surface as a legitimate "Field [X] not found" caught by the per-field patterns above.
        ]
        // Accumulators populated during XML scan, rendered in the "Out of scope" section.
        def outOfScopeClassCounts = new java.util.LinkedHashMap<String, int[]>()
        def outOfScopeMessageCounts = new java.util.LinkedHashMap<String, Integer>()
        def outOfScopeMessageReason = new java.util.LinkedHashMap<String, String>()
        OUT_OF_SCOPE_MESSAGE_PATTERNS.each { entry ->
            outOfScopeMessageReason[entry[0]] = entry[1]
        }

        // Map a top stack frame's package prefix to a short origin label.
        // Order matters: most-specific prefix first.
        Closure originFromFrame = { String fqClassMethod ->
            if (fqClassMethod == null || fqClassMethod.isEmpty()) return '?'
            String f = fqClassMethod
            if (f.startsWith('org.opensearch.sql.calcite.')) return 'SQL/calcite'
            if (f.startsWith('org.opensearch.sql.')) return 'SQL/other'
            if (f.startsWith('org.opensearch.analytics.')) return 'AE'
            if (f.startsWith('org.opensearch.parquet.') ||
                f.startsWith('org.opensearch.composite.') ||
                f.startsWith('org.opensearch.dsl.')) return 'AE/plugin'
            if (f.startsWith('org.apache.calcite.')) return 'Calcite'
            if (f.startsWith('org.opensearch.')) return 'OpenSearch'
            if (f.startsWith('java.') || f.startsWith('jdk.') || f.startsWith('sun.')) return 'JDK'
            return '?'
        }

        // Cluster-log scan: walk every exception block to recover (cause class, normalized
        // message, top server-side stack frame). REST-side failure messages don't carry the
        // throw frame because the SQL response formatter only emits {type, reason, details};
        // we recover the frame from the cluster log here.
        //
        // Match BOTH styles a server-side exception can appear in the log:
        //   (a) "Caused by: <fq.exc>: <msg>"     — when wrapped (e.g. by UnifiedQueryPlanner)
        //   (b) "<fq.exc>: <msg>"                 — top-level dumps from log4j (no wrapper)
        // For each, the next "    at <fq.class>.<method>(..." line is the throw frame we want.
        //
        // Map: "<simpleExc> | <normalized message>" -> top stack frame "fq.Class.method".
        // First match wins per signature (any ambiguity surfaces in the report's '?' rows).
        Map<String, String> sigToTopFrame = new java.util.LinkedHashMap<>()
        if (clusterLog) {
            File clusterLogFile = new File(clusterLog.toString())
            if (clusterLogFile.exists()) {
                String pendingSig = null
                int pendingLines = 0
                clusterLogFile.eachLine { String line ->
                    // (a) Caused-by line.
                    def causedBy = line =~ /^Caused by: ([\w\.\$]+(?:Exception|Error|Failure)): ?(.*)$/
                    // (b) Top-level exception line — must contain at least one '.' in the FQ class
                    //     to avoid false-matching prose. Restrict to lines starting with "java." /
                    //     "org." / "com." / "io." / "net." / "javax." — covers all server-side
                    //     stack roots without dragging in user-input text.
                    def topLevel = line =~ /^((?:java|javax|jdk|sun|org|com|io|net)\.[\w\.\$]+(?:Exception|Error|Failure)): ?(.*)$/
                    String fqExc = null
                    String rawMsg = null
                    if (causedBy.find()) {
                        fqExc = causedBy.group(1)
                        rawMsg = causedBy.group(2)
                    } else if (topLevel.find()) {
                        fqExc = topLevel.group(1)
                        rawMsg = topLevel.group(2)
                    }
                    if (fqExc != null) {
                        String simpleExc = fqExc.substring(fqExc.lastIndexOf('.') + 1)
                        String normMsg = normalize(rawMsg)
                        pendingSig = "${simpleExc} | ${normMsg}".toString()
                        pendingLines = 0
                        return
                    }
                    if (pendingSig == null) return
                    // First "at <fq.class>.method(...)" frame after the exception line.
                    def atFrame = line =~ /^\s+at ([\w\.\$]+)\.([\w<>\$]+)\(/
                    if (atFrame.find()) {
                        String topFrame = "${atFrame.group(1)}.${atFrame.group(2)}".toString()
                        sigToTopFrame.putIfAbsent(pendingSig, topFrame)
                        pendingSig = null
                        return
                    }
                    if (++pendingLines > 30) {
                        // Exception block ran on without a recognizable frame.
                        pendingSig = null
                    }
                }
                logger.lifecycle("[analyticsCompatibilityReport] Cluster log: ${sigToTopFrame.size()} unique cause signatures with stack frames recovered from ${clusterLogFile.absolutePath}.")
            } else {
                logger.lifecycle("[analyticsCompatibilityReport] Cluster log not found at ${clusterLog} — Origin column will mostly say '?'. Override with -PclusterLog=...")
            }
        } else {
            logger.lifecycle("[analyticsCompatibilityReport] No cluster log path resolved — Origin column will mostly say '?'. Pass -PclusterLog=...")
        }

        def parser = new groovy.xml.XmlParser(false, false)
        int totalTests = 0
        int totalFailures = 0
        int totalErrors = 0
        int totalSkipped = 0
        long totalTimeMs = 0
        // Bucket: "<ExcLabel> | <normalized message>" -> [list of "Class.method"]
        def buckets = new java.util.LinkedHashMap<String, java.util.List<String>>()
        // Bucket key -> origin label resolved at bucket time so the table render is a lookup.
        def bucketOrigin = new java.util.LinkedHashMap<String, String>()
        // Per-class summary: className -> [tests, failures+errors, skipped]
        def perClass = new java.util.TreeMap<String, int[]>()

        xmlDir.eachFileMatch(~/TEST-.*\.xml/) { xmlFile ->
            def root
            try {
                root = parser.parse(xmlFile)
            } catch (Exception e) {
                logger.warn("[analyticsCompatibilityReport] Failed to parse ${xmlFile.name}: ${e.message}")
                return
            }
            def className = root.@name?.toString() ?: xmlFile.name
            int classTests = (root.@tests ?: '0').toString().toInteger()
            int classFailures = (root.@failures ?: '0').toString().toInteger()
            int classErrors = (root.@errors ?: '0').toString().toInteger()
            int classSkipped = (root.@skipped ?: '0').toString().toInteger()
            double classTime = ((root.@time ?: '0') as String).replace(',', '.').toDouble()

            // Class-level out-of-scope: exclude the entire file from totals, record separately.
            if (OUT_OF_SCOPE_CLASSES.contains(className)) {
                outOfScopeClassCounts[className] = [classTests, classFailures + classErrors, classSkipped] as int[]
                totalTimeMs += (long) (classTime * 1000)
                return
            }

            // Per-testcase scan to identify message-based out-of-scope tests; subtract those
            // from the class totals so they don't pollute pass rate. Bucket scan happens
            // again below for the kept testcases.
            int classExcludedTests = 0
            int classExcludedFailures = 0
            root.testcase.each { tc ->
                def fn = tc.failure ? tc.failure[0] : (tc.error ? tc.error[0] : null)
                if (fn == null) return
                String m = (fn.@message?.toString() ?: '') + ' ' + (fn.text() ?: '')
                for (entry in OUT_OF_SCOPE_MESSAGE_PATTERNS) {
                    if (m.contains(entry[0])) {
                        classExcludedTests++
                        classExcludedFailures++
                        outOfScopeMessageCounts.merge(entry[0], 1, Integer.&sum)
                        break
                    }
                }
            }

            totalTests += (classTests - classExcludedTests)
            totalFailures += (classFailures - classExcludedFailures)
            totalErrors += classErrors
            totalSkipped += classSkipped
            totalTimeMs += (long) (classTime * 1000)
            perClass[className] = [classTests - classExcludedTests, classFailures + classErrors - classExcludedFailures, classSkipped] as int[]

            root.testcase.each { tc ->
                def testName = tc.@name?.toString() ?: '<unknown>'
                def fqid = "${className}#${testName}"
                def failureNode = tc.failure ? tc.failure[0] : (tc.error ? tc.error[0] : null)
                if (failureNode == null) return

                def excType = failureNode.@type?.toString() ?: '<unknown>'
                def msg = failureNode.@message?.toString() ?: ''
                def body = failureNode.text() ?: ''

                // Skip message-level out-of-scope testcases — already counted in
                // outOfScopeMessageCounts and subtracted from class totals.
                String scopeMatch = msg + ' ' + body
                boolean isOutOfScope = false
                for (entry in OUT_OF_SCOPE_MESSAGE_PATTERNS) {
                    if (scopeMatch.contains(entry[0])) { isOutOfScope = true; break }
                }
                if (isOutOfScope) return

                // ResponseException collapses every 500/4xx into one bucket because its message
                // starts with the same wrapper text. Reach into the response body and extract the
                // server's actual exception class + the message text. The SQL formatter ships the
                // cause via three JSON fields:
                //   type    — the inner exception's simple class name
                //   reason  — typically the formatter's wrapper "There was internal problem at backend"
                //   details — the actual exception message text we want to bucket on
                // Same shape applies to AssertionError that wraps a ResponseException stack trace.
                def excLabel = excType
                def innerExcSimple = null
                def primary = msg
                def innerType = (msg =~ /"type"\s*:\s*"([^"]+)"/)
                def innerReason = (msg =~ /"reason"\s*:\s*"([^"]+)"/)
                def innerDetails = (msg =~ /"details"\s*:\s*"([^"]+)"/)
                if (excType.endsWith('ResponseException') || excType.endsWith('AssertionError')) {
                    if (innerType.find()) {
                        innerExcSimple = innerType.group(1)
                        excLabel = "${excType} → ${innerExcSimple}"
                    }
                    String innerMsg = ''
                    innerReason.reset()
                    innerDetails.reset()
                    if (innerReason.find()) innerMsg = innerReason.group(1)
                    // Prefer details when present — that's the actual cause text. Fall back to
                    // reason (the wrapper string) only when details is missing.
                    if (innerDetails.find()) innerMsg = innerDetails.group(1)
                    if (!innerMsg.isEmpty()) primary = innerMsg
                }

                if (primary == null || primary.trim().isEmpty()) {
                    primary = body.split(/\r?\n/).find { it != null && !it.trim().isEmpty() } ?: ''
                }
                primary = primary.replace('\n', ' ').replace('\r', ' ').trim()

                String normalized = normalize(primary)

                def key = "${excLabel} | ${normalized}".toString()
                buckets.computeIfAbsent(key, { new java.util.ArrayList<String>() }).add(fqid)

                // Resolve origin once per bucket: match cluster-log signature
                // "<innerExcSimple> | <normalized stripped of formatter prefix>" against the
                // sigToTopFrame map. Buckets without a cluster-log match show '?'.
                if (!bucketOrigin.containsKey(key)) {
                    String simpleExc = innerExcSimple ?: excType
                    String stripped = normalized
                            .replaceFirst(/^There was internal problem at backend(: )?/, '')
                    String sig = "${simpleExc} | ${stripped}".toString()
                    String topFrame = sigToTopFrame.get(sig)
                    if (topFrame == null) {
                        // Some buckets (e.g. SemanticCheckException from pre-flight) don't go
                        // through "Failed to plan query" wrapping but still come from our SQL
                        // plugin. Fall back to classifying by exception class name origin.
                        if (simpleExc in [
                                'SemanticCheckException',
                                'ExpressionEvaluationException',
                                'SqlParseException']) {
                            bucketOrigin[key] = 'SQL/preflight'
                        } else {
                            bucketOrigin[key] = '?'
                        }
                    } else {
                        bucketOrigin[key] = originFromFrame(topFrame)
                    }
                }
            }
        }

        int totalFailed = totalFailures + totalErrors
        int totalPassed = totalTests - totalFailed - totalSkipped
        // Pass rate is reported over executed (passed + failed) tests, deliberately excluding
        // skipped. Skipped tests don't tell us anything about analytics-engine compatibility —
        // counting them in the denominator would dilute the signal we're after.
        int totalExecuted = totalPassed + totalFailed
        double passPct = totalExecuted == 0 ? 0.0 : (100.0 * totalPassed / totalExecuted)

        def sb = new StringBuilder()
        sb << "# Analytics-engine PPL IT Compatibility Report\n\n"
        sb << "Generated: ${new Date()}\n\n"
        sb << "Cluster under test: `${System.getProperty('tests.rest.cluster') ?: '<unspecified>'}`\n\n"
        sb << "Routing: every PPL query forced through the analytics-engine path " +
                "(`tests.analytics.force_routing=true`, which sets the cluster setting " +
                "`plugins.calcite.analytics.force_routing=true`).\n\n"
        // Out-of-scope totals — shown in the summary line + the dedicated section below so the
        // reader knows what was excluded from pass-rate math.
        int outOfScopeClassTests = (int) outOfScopeClassCounts.values().sum(0) { (int) it[0] }
        int outOfScopeMessageTests = (int) outOfScopeMessageCounts.values().sum(0)
        int outOfScopeTotal = outOfScopeClassTests + outOfScopeMessageTests

        int totalBeforeExclusion = totalTests + outOfScopeTotal
        sb << "## Summary\n\n"
        sb << "| Metric | Count |\n"
        sb << "|---|---|\n"
        sb << "| Total tests (before exclusion) | ${totalBeforeExclusion} |\n"
        sb << "| Tests executed (in scope) | ${totalTests} |\n"
        sb << "| Passed | ${totalPassed} |\n"
        sb << "| Failed | ${totalFailures} |\n"
        sb << "| Errored | ${totalErrors} |\n"
        sb << "| Skipped | ${totalSkipped} |\n"
        sb << "| **Pass rate** (passed / (passed + failed), in scope) | **${String.format('%.1f', passPct)}%** |\n"
        if (outOfScopeTotal > 0) {
            sb << "| Out of scope (excluded from pass rate) | ${outOfScopeTotal} |\n"
        }
        sb << "| Total time | ${String.format('%.1f', totalTimeMs / 1000.0)}s |\n\n"

        // ---- Failures by category ----------------------------------------
        // Classify every in-scope failure into one of three buckets:
        //   - Correctness — the query executed but the result was wrong. Detected as a
        //     test-side AssertionError / ComparisonFailure with no nested server-side
        //     exception (no `→` in the bucket key, meaning the JUnit failure body did
        //     not carry a wrapped ResponseException JSON).
        //   - Unsupported — query failed because the analytics-engine path declared the
        //     surface unsupported. Includes server-side `IllegalStateException` (planner
        //     "shouldn't reach here" assertions), `UnsupportedOperationException`,
        //     `SubstraitConversionException`, server-side `AssertionError`
        //     (Calcite Litmus.THROW), and any innermost exception whose message starts
        //     with phrases like "Unsupported", "No backend", "Cannot plan", etc.
        //   - Stability — actual bugs the analytics-engine path didn't handle:
        //     `IndexOutOfBoundsException`, `NullPointerException`, `ClassCastException`,
        //     `ArithmeticException`, `NumberFormatException`, `IllegalArgumentException`,
        //     `JSONException`, etc. The query failed to execute and the cause isn't a
        //     declared limitation.
        def UNSUPPORTED_EXC_SIMPLE = [
            'UnsupportedOperationException',
            'SubstraitConversionException',
            'SemanticCheckException',
            'IllegalStateException',
        ] as Set
        def STABILITY_EXC_SIMPLE = [
            'IndexOutOfBoundsException',
            'ArrayIndexOutOfBoundsException',
            'StringIndexOutOfBoundsException',
            'NullPointerException',
            'ClassCastException',
            'ArithmeticException',
            'NumberFormatException',
            'IllegalArgumentException',
            'JSONException',
            'JsonProcessingException',
            'JsonParseException',
        ] as Set
        def UNSUPPORTED_MSG_HINTS = [
            'Unsupported',
            'not supported',
            'is not yet supported',
            'No backend',
            'No enum constant',
            'Cannot plan',
            'doesn\'t support',
            'is not implemented',
            'not yet implemented',
        ]
        int correctnessCount = 0
        int unsupportedCount = 0
        int stabilityErrorCount = 0
        buckets.each { key, fqids ->
            String[] parts = key.split(/ \| /, 2)
            String excLabel = parts[0]
            String msgPart = parts.length > 1 ? parts[1] : ''
            boolean hasInner = excLabel.contains(' → ')
            // Innermost exception simple name: part after `→` if wrapped, else the outer name.
            String rawInner = hasInner ? excLabel.substring(excLabel.lastIndexOf('→') + 1).trim() : excLabel
            // Strip package prefix — the bucket-key carries the FQN (e.g. java.lang.AssertionError,
            // org.json.JSONException) while our category sets list simple names.
            String innerExc = rawInner.contains('.') ? rawInner.substring(rawInner.lastIndexOf('.') + 1) : rawInner
            boolean isAssertion = innerExc == 'AssertionError' || innerExc == 'ComparisonFailure'
            boolean msgUnsupported = UNSUPPORTED_MSG_HINTS.any { msgPart.contains(it) }

            if (isAssertion && !hasInner) {
                // Test-side AssertionError directly off the JUnit body → result mismatch.
                correctnessCount += fqids.size()
            } else if (isAssertion && hasInner) {
                // Server-side AssertionError surfaced via ResponseException JSON → Calcite
                // Litmus.THROW (planner reached a code path it considers illegal). Treat as
                // unsupported surface, not a stability bug.
                unsupportedCount += fqids.size()
            } else if (UNSUPPORTED_EXC_SIMPLE.contains(innerExc) || msgUnsupported) {
                unsupportedCount += fqids.size()
            } else if (STABILITY_EXC_SIMPLE.contains(innerExc)) {
                stabilityErrorCount += fqids.size()
            } else {
                // Unknown exception type — default to stability so it stays visible.
                stabilityErrorCount += fqids.size()
            }
        }
        int categorizedTotal = correctnessCount + unsupportedCount + stabilityErrorCount
        if (categorizedTotal > 0) {
            sb << "## Failures by category\n\n"
            sb << "Every in-scope failure is one of three kinds. *Correctness* failures mean the query ran successfully but returned wrong rows / wrong types / wrong cardinality (test-side AssertionError on the response). *Unsupported* failures mean the analytics-engine path explicitly rejected the query — planner illegal-state assertions, Litmus.THROW, `UnsupportedOperationException`, Substrait conversion errors, or messages like \"No backend supports …\". *Stability* failures mean the path crashed on something it should have handled — `NullPointerException`, `IndexOutOfBoundsException`, `ClassCastException`, `IllegalArgumentException`, etc.\n\n"
            sb << "| Category | Failures | Share | Definition |\n"
            sb << "|---|---:|---:|---|\n"
            int cPct = (int) Math.round(100.0 * correctnessCount / categorizedTotal)
            int uPct = (int) Math.round(100.0 * unsupportedCount / categorizedTotal)
            int sPct = Math.max(0, 100 - cPct - uPct)
            sb << "| Correctness (query executed, wrong result) | ${correctnessCount}     | ${cPct}% | Test-side `AssertionError` / `ComparisonFailure` without a server-response wrapper. |\n"
            sb << "| Unsupported (declared limitation) | ${unsupportedCount}     | ${uPct}% | Server-side `IllegalStateException`, `UnsupportedOperationException`, `SubstraitConversionException`, `SemanticCheckException`, Litmus.THROW `AssertionError`, or innermost message indicating the surface is unsupported / no backend / not implemented. |\n"
            sb << "| Stability (engine bug) | ${stabilityErrorCount}  | ${sPct}% | `NullPointerException`, `IndexOutOfBoundsException`, `ClassCastException`, `ArithmeticException`, `NumberFormatException`, `IllegalArgumentException`, `JSONException`, or any exception not declared above. |\n\n"
        }

        // ---- Shared rendering helpers -----------------------------------
        // `cell` is used by the Top-N rendering below.
        Closure cell = { String s ->
            (s ?: '').replace('|', '/').replace('\n', ' ').replace('\r', ' ').trim()
        }

        // ---- Out of scope ------------------------------------------------
        // Tests we intentionally exclude from pass-rate math. Two categories:
        //   - Whole IT classes whose surface we don't plan to support on the analytics-engine
        //     route (e.g. CalciteExplainIT — explain output isn't a coverage signal).
        //   - Specific error messages tied to features we won't implement (e.g. LogicalGraphLookup).
        if (outOfScopeTotal > 0) {
            sb << "## Out of scope (excluded from pass rate)\n\n"
            sb << "Tests excluded from both numerator and denominator of the pass-rate calculation. Adjust the lists in `integ-test/build.gradle` (`OUT_OF_SCOPE_CLASSES`, `OUT_OF_SCOPE_MESSAGE_PATTERNS`) to update.\n\n"
            if (!outOfScopeClassCounts.isEmpty()) {
                sb << "### Excluded test classes\n\n"
                sb << "| Class | Tests | Failures | Skipped |\n"
                sb << "|---|---:|---:|---:|\n"
                outOfScopeClassCounts.entrySet().toList().sort { -it.value[0] }.each { e ->
                    int[] c = e.value
                    sb << "| `${e.key}` | ${c[0]} | ${c[1]} | ${c[2]} |\n"
                }
                sb << "\n"
            }
            if (!outOfScopeMessageCounts.isEmpty()) {
                sb << "### Excluded by error message\n\n"
                sb << "| Message contains | Tests | Reason |\n"
                sb << "|---|---:|---|\n"
                outOfScopeMessageCounts.entrySet().toList().sort { -it.value }.each { e ->
                    String reason = outOfScopeMessageReason.get(e.key) ?: ''
                    sb << "| `${e.key}` | ${e.value} | ${reason} |\n"
                }
                sb << "\n"
            }
        }

        int TOP_BUCKETS = 25

        def sortedBuckets = buckets.isEmpty() ? [] : buckets.entrySet().toList().sort { -it.value.size() }
        int totalFailedAll = (int) sortedBuckets.sum(0) { it.value.size() }
        int remainingBuckets = Math.max(0, sortedBuckets.size() - TOP_BUCKETS)
        int remainingFails = remainingBuckets == 0 ? 0 :
                (int) sortedBuckets.drop(TOP_BUCKETS).sum(0) { it.value.size() }

        sb << "## Top ${Math.min(TOP_BUCKETS, sortedBuckets.size())} failure buckets\n\n"
        sb << "Origin column legend: `SQL/calcite` = our SQL plugin's Calcite visitors (`org.opensearch.sql.calcite.*`); `SQL/preflight` = our SQL plugin's parser/analyzer (raised before reaching the analytics-engine path); `SQL/other` = other SQL-plugin code; `AE` = analytics-engine plugin (`org.opensearch.analytics.*`); `AE/plugin` = analytics-engine sister plugins (parquet/composite/dsl); `Calcite` = the Apache Calcite library; `OpenSearch` = OpenSearch core; `Test` = test code (assertion failure, not a server error); `?` = no matching cluster-log frame found.\n\n"
        if (sortedBuckets.isEmpty()) {
            sb << "_No failures._\n\n"
        } else {
            sb << "| # | Count | Origin | Error |\n"
            sb << "|---:|---:|:--|---|\n"
            int idx = 0
            sortedBuckets.take(TOP_BUCKETS).each { entry ->
                idx++
                def parts = entry.key.split(/ \| /, 2)
                def excType = parts.length > 0 ? parts[0] : '<unknown>'
                def msg = parts.length > 1 ? parts[1] : ''
                def shortExc = excType.replaceFirst(/^.*?(ResponseException|AssertionError) → /, '')
                shortExc = shortExc.replaceFirst(/^java\.lang\./, '').replaceFirst(/^org\.opensearch\.[^ ]*\./, '')
                def combined = "${shortExc} — ${msg}"
                String origin = bucketOrigin.get(entry.key) ?: '?'
                // ComparisonFailure / AssertionError without an inner ResponseException are
                // pure test-side assertion failures — classify regardless of cluster log.
                if (origin == '?' && (excType.endsWith('ComparisonFailure') || excType == 'java.lang.AssertionError' || excType == 'AssertionError')) {
                    origin = 'Test'
                }
                sb << "| ${idx} | ${entry.value.size()} | ${origin} | ${cell(combined)} |\n"
            }
            if (remainingBuckets > 0) {
                sb << "\n_${remainingBuckets} more buckets cover the remaining ${remainingFails} failures (long tail, each ≤${sortedBuckets.get(TOP_BUCKETS).value.size()} tests)._\n\n"
            }
        }

        // ---- Top N: detailed per-bucket breakdown ----------------------
        // For each of the top DETAIL_BUCKETS buckets (capped at 15 by default), list every
        // failing (class, test method) the bucket covers and one representative stack trace.
        // Lets a triager drill straight from the top-N table into the actionable details
        // without grepping the XMLs by hand.
        int DETAIL_BUCKETS = 15
        Closure shortenExcForDetail = { String exc ->
            exc.replaceFirst(/^.*?(ResponseException|AssertionError) → /, '')
                    .replaceFirst(/^java\.lang\./, '').replaceFirst(/^org\.opensearch\.[^ ]*\./, '')
        }

        if (!sortedBuckets.isEmpty()) {
            int detailCount = Math.min(DETAIL_BUCKETS, sortedBuckets.size())
            sb << "## Top ${detailCount} failure buckets — detailed breakdown\n\n"
            sb << "For each of the top ${detailCount} buckets, every failing `Class.test` is listed. Full failure bodies are in `integ-test/build/test-results/analyticsCompatibility/`.\n\n"
            int idx2 = 0
            sortedBuckets.take(detailCount).each { entry ->
                idx2++
                def parts = entry.key.split(/ \| /, 2)
                String excType = parts.length > 0 ? parts[0] : '<unknown>'
                String msg = parts.length > 1 ? parts[1] : ''
                String shortExc = shortenExcForDetail(excType)
                String origin = bucketOrigin.get(entry.key) ?: '?'
                if (origin == '?' && (excType.endsWith('ComparisonFailure') || excType == 'java.lang.AssertionError' || excType == 'AssertionError')) {
                    origin = 'Test'
                }
                int count = entry.value.size()
                sb << "### #${idx2} — ${count} failure${count == 1 ? '' : 's'} — `${shortExc}` — Origin: ${origin}\n\n"
                sb << "**Message**: ${cell(msg)}\n\n"
                sb << "**Failing tests** (${count}):\n\n"
                entry.value.toList().sort().each { fqid ->
                    def matcher = fqid =~ /^(.+?)#(.+)$/
                    if (matcher) {
                        String cls = matcher[0][1].toString().replaceFirst(/^org\.opensearch\.sql\.calcite\.remote\./, '').replaceFirst(/^org\.opensearch\.sql\./, '')
                        sb << "- `${cls}.${matcher[0][2]}`\n"
                    } else {
                        sb << "- `${fqid}`\n"
                    }
                }
                sb << "\n"
            }
        }

        reportFile.text = sb.toString()
        logger.lifecycle("[analyticsCompatibilityReport] Wrote ${reportFile}")
        logger.lifecycle("[analyticsCompatibilityReport] ${totalPassed}/${totalExecuted} passed " +
                "(${String.format('%.1f', passPct)}%, excludes skipped), " +
                "${totalFailed} failed, ${totalSkipped} skipped, ${totalTests} total")
    }
}

// =============================================================================
// integTestsReport — per-test failure listing
//
// Companion to analyticsCompatibilityReport. Reads the same JUnit XMLs but emits
// a fundamentally different shape: every failing test method gets its own row
// with the class, method name, exception type, and clipped failure message.
// Use this when you need to see which specific test methods are failing within
// each class — the bucket report aggregates failures globally and hides the
// per-class detail.
// =============================================================================
task integTestsReport {
    description = "Per-test failure listing — each failing test method with its exception " +
            "type and clipped error message. Complements analyticsCompatibilityReport."
    group = "verification"
    dependsOn analyticsCompatibilityTest

    def xmlDir = file("$buildDir/test-results/analyticsCompatibility")
    def reportDir = file("$buildDir/reports/analytics-compatibility")
    def reportFile = file("$reportDir/INTEG_TESTS_REPORT.md")

    inputs.dir(xmlDir).optional()
    outputs.file(reportFile)

    doLast {
        reportDir.mkdirs()
        if (!xmlDir.isDirectory()) {
            reportFile.text = "_No JUnit XML output found at ${xmlDir} — did analyticsCompatibilityTest run?_\n"
            logger.lifecycle("[integTestsReport] Skipped — ${xmlDir} not present")
            return
        }

        // Each failing test's row: (classFqn, methodName, exceptionType, clippedMessage).
        // Tracked per-class so the renderer can emit one section per class with a stable
        // ordering (descending by failure count, then ascending by class name).
        def perClassFailures = [:]
        int totalFailingTests = 0

        // Match <failure type="..." message="..."> — JUnit's XML escapes &quot;, &lt;, &gt;
        // inside the message attribute. We decode the standard entities so the rendered
        // message reads naturally; the original text in test-results/ is the source of truth.
        def failureExtractor = ~/(?s)<failure[^>]*\bmessage="([^"]*)"[^>]*\btype="([^"]*)"/
        Closure decodeXml = { String s ->
            (s ?: '').replace('&amp;', '&').replace('&lt;', '<').replace('&gt;', '>')
                    .replace('&quot;', '"').replace('&apos;', "'")
                    .replace('&#10;', ' ').replace('&#13;', ' ').replace('\n', ' ').replace('\r', ' ').trim()
        }
        Closure cellSafe = { String s ->
            (s ?: '').replace('|', '/').trim()
        }

        // The PPL details JSON inside ResponseException.message is the most useful slice for
        // bucketing. Pull "details": "..." when present; fall back to the first 200 chars of
        // the raw message otherwise. Mirrors analyticsCompatibilityReport's bucket key shape
        // so a row and a bucket entry are recognisably the same failure at a glance.
        Closure shortMessage = { String fullMessage ->
            def detailsMatch = (fullMessage =~ /"details"\s*:\s*"([^"]+)"/)
            if (detailsMatch.find()) return decodeXml(detailsMatch.group(1))
            return decodeXml(fullMessage)
        }
        Closure shortExc = { String fullType ->
            (fullType ?: '?').replaceFirst(/^java\.lang\./, '').replaceFirst(/^org\.opensearch\.[^ ]*\./, '')
        }

        xmlDir.eachFileMatch(~/^TEST-.*\.xml$/) { xml ->
            String classFqn = xml.name.replaceFirst(/^TEST-/, '').replaceFirst(/\.xml$/, '')
            def rows = []
            // Stream the file line-by-line to avoid loading multi-megabyte ResponseException
            // payloads (some PPL failures embed entire HTTP response bodies). For each
            // <testcase>...<failure ...>...</failure>...</testcase> block we only need the
            // testcase name + the failure's type/message attributes.
            String currentTest = null
            StringBuilder block = null
            xml.eachLine { line ->
                def m = (line =~ /<testcase[^>]*\bname="([^"]+)"/)
                if (m.find()) {
                    currentTest = m.group(1)
                    block = new StringBuilder()
                }
                if (block != null) {
                    block.append(line).append('\n')
                }
                if (line.contains('</testcase>') && currentTest != null && block != null) {
                    def failureMatch = (block.toString() =~ failureExtractor)
                    if (failureMatch.find()) {
                        String rawMessage = failureMatch.group(1)
                        String rawType = failureMatch.group(2)
                        rows.add([currentTest, shortExc(rawType), shortMessage(rawMessage)])
                    }
                    currentTest = null
                    block = null
                }
            }
            if (!rows.isEmpty()) {
                perClassFailures[classFqn] = rows
                totalFailingTests += rows.size()
            }
        }

        // Sort classes by failure count desc, then class name asc.
        def sortedClasses = perClassFailures.entrySet().toList().sort { a, b ->
            int cmp = b.value.size() <=> a.value.size()
            cmp != 0 ? cmp : a.key <=> b.key
        }

        def sb = new StringBuilder()
        sb << "# Per-Test IT Failure Report\n\n"
        sb << "Generated: ${new Date()}\n\n"
        sb << "Cluster under test: `${System.getProperty('tests.rest.cluster') ?: '<unspecified>'}`\n\n"
        sb << "Routing: every PPL query forced through the analytics-engine path " +
                "(`tests.analytics.force_routing=true`, which sets the cluster setting " +
                "`plugins.calcite.analytics.force_routing=true`).\n\n"

        sb << "## Summary\n\n"
        sb << "| Metric | Count |\n"
        sb << "|---|---:|\n"
        sb << "| Test classes with failures | ${sortedClasses.size()} |\n"
        sb << "| Failing test methods | ${totalFailingTests} |\n\n"

        // Per-class detail tables. Each class block lists every failing method with its
        // exception type and clipped message. Methods stay in JUnit XML order so a reader
        // diffing two reports sees stable rows for unchanged tests.
        sb << "## Failing tests by class\n\n"
        sortedClasses.each { entry ->
            String fqn = entry.key
            def rows = entry.value
            String shortClass = fqn.replaceFirst(/^.*\./, '')
            sb << "### ${shortClass} (${rows.size()} failing)\n\n"
            sb << "Full class: `${fqn}`\n\n"
            sb << "| Test method | Exception | Message |\n"
            sb << "|---|---|---|\n"
            rows.each { row ->
                String method = row[0]
                String exc = row[1]
                String msg = row[2]
                sb << "| `${cellSafe(method)}` | ${cellSafe(exc)} | ${cellSafe(msg)} |\n"
            }
            sb << "\n"
        }

        reportFile.text = sb.toString()
        logger.lifecycle("[integTestsReport] Wrote ${reportFile}")
        logger.lifecycle("[integTestsReport] ${totalFailingTests} failing tests across ${sortedClasses.size()} classes")
    }
}

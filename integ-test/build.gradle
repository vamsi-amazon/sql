task integTestRemote(type: RestIntegTestTask) {
    testLogging {
        events "passed", "skipped", "failed"
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'tests.security.manager', 'false'
    systemProperty('project.root', project.projectDir.absolutePath)
    systemProperty 'java.io.tmpdir', opensearch_tmp_dir.absolutePath

    systemProperty "https", System.getProperty("https")
    systemProperty "user", System.getProperty("user")
    systemProperty "password", System.getProperty("password")

    // Forward the analytics-engine parquet-indices toggle when set on the gradle command
    // line. TestUtils.createIndexByRestClient reads this to back every test-created index
    // with composite/parquet so RestUnifiedQueryAction.isAnalyticsIndex (post-#5432) routes
    // to the analytics-engine planner via index settings.
    if (System.getProperty("tests.analytics.parquet_indices") != null) {
        systemProperty 'tests.analytics.parquet_indices', System.getProperty("tests.analytics.parquet_indices")
    }

    // True only when the analytics-engine route is active (every test index parquet-backed). Matches
    // AnalyticsIndexConfig.isEnabled, which parses the value rather than checking mere presence, so a
    // `-Dtests.analytics.parquet_indices=false` run stays on the v2 path.
    def analyticsEnabled = Boolean.parseBoolean(System.getProperty("tests.analytics.parquet_indices", "false"))

    // Set default query size limit
    systemProperty 'defaultQuerySizeLimit', '10000'

    filter {
        if (System.getProperty("tests.rest.bwcsuite") == null) {
            excludeTestsMatching "org.opensearch.sql.bwc.*IT"
        }

        if (analyticsEnabled) {
            // Full-text search (search-filter syntax -> Lucene query_string) needs an inverted-index
            // reader that parquet-backed analytics indices lack, so it's unsupported on this route.
            excludeTestsMatching '*OperatorIT.testEqualOperator'
            excludeTestsMatching '*OperatorIT.testNotEqualOperator'
            excludeTestsMatching '*OperatorIT.testLessOperator'
            excludeTestsMatching '*OperatorIT.testLteOperator'
            excludeTestsMatching '*OperatorIT.testGreaterOperator'
            excludeTestsMatching '*OperatorIT.testGteOperator'
            excludeTestsMatching '*OperatorIT.testNotOperator'
        }
    }

    // Exclude the same tests that are excluded for integTest
    exclude 'org/opensearch/sql/doctest/**/*IT.class'
    exclude 'org/opensearch/sql/correctness/**'
    exclude 'org/opensearch/sql/legacy/ExplainIT.class'
    exclude 'org/opensearch/sql/legacy/PrettyFormatterIT.class'
    exclude 'org/opensearch/sql/legacy/TermQueryExplainIT.class'
    exclude 'org/opensearch/sql/legacy/QueryAnalysisIT.class'
    exclude 'org/opensearch/sql/legacy/OrderIT.class'
    exclude 'org/opensearch/sql/jdbc/**'
}

// =============================================================================
// Analytics-engine PPL IT compatibility report
//
// Runs every PPL IT through the analytics-engine path against an externally-
// managed cluster (started with the analytics-engine plugin set installed),
// then post-processes the JUnit XMLs into a markdown coverage report bucketed
// by exception type and normalized error message.
//
// End-to-end usage:
//
//   1. Start an OpenSearch node with the analytics-engine plugin set
//      installed and the SQL plugin built locally.
//
//   2. Run:
//        ./gradlew :integ-test:analyticsCompatibilityReport \
//            -Dtests.rest.cluster=localhost:9200 \
//            -Dtests.cluster=localhost:9300 \
//            -Dtests.clustername=runTask
//
//   3. Read the report at:
//        integ-test/build/reports/analytics-compatibility/REPORT.md
//
// The test task always succeeds (`ignoreFailures = true`) so the report is
// produced even when the analytics path can't yet handle a command — failures
// are the signal we're after, not a build break.
//
// How the test-side hook works (PPLIntegTestCase.java):
//   - The test task sets `-Dtests.analytics.force_routing=true`.
//   - PPLIntegTestCase.init() reads that property and calls
//     enableAnalyticsForceRouting() during setup, which flips the cluster
//     setting plugins.calcite.analytics.force_routing=true.
//   - RestUnifiedQueryAction.isAnalyticsIndex() honors that setting and
//     returns true unconditionally — so every query routes through the
//     analytics-engine planner regardless of index name.
// =============================================================================
task analyticsCompatibilityTest(type: RestIntegTestTask) {
    description = "Runs all PPL ITs through the analytics-engine path. Always succeeds; results " +
            "are post-processed by analyticsCompatibilityReport."
    group = "verification"

    testLogging {
        events "skipped", "failed"
        exceptionFormat "short"
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    // Drop the per-task testcluster that build-tools' RestTestBasePlugin auto-creates
    // for every RestIntegTestTask. We hit an externally-managed runTask cluster via
    // -Dtests.rest.cluster=..., so the auto-bound cluster (with 0 plugins) just brings
    // up an empty OpenSearch JVM the framework immediately tears down — and on recent
    // build-tools snapshots that teardown surfaces as a build-fatal EOFException.
    // See OpenSearch buildSrc RestTestBasePlugin.java:57.
    getClusters().clear()

    systemProperty 'tests.security.manager', 'false'
    systemProperty 'project.root', project.projectDir.absolutePath
    systemProperty 'java.io.tmpdir', opensearch_tmp_dir.absolutePath
    systemProperty 'defaultQuerySizeLimit', '10000'

    // Force every PPL query through the analytics-engine path. Picked up by
    // PPLIntegTestCase.init() via the ANALYTICS_FORCE_ROUTING_PROP constant.
    systemProperty 'tests.analytics.force_routing', 'true'

    // Make every test-created index parquet-backed (composite primary data format = parquet,
    // single shard) so the analytics-engine planner has a backend that can scan the storage.
    // Picked up by TestUtils.createIndexByRestClient via ANALYTICS_PARQUET_INDICES_PROP.
    // Without this, ~60% of tests fail with "No backend can scan all requested fields".
    systemProperty 'tests.analytics.parquet_indices', 'true'

    // Multi-shard config — defaults to 1 shard, 0 replicas (original behavior).
    // Overridden by the multi-shard task variants below.
    systemProperty 'tests.analytics.num_shards', '1'
    systemProperty 'tests.analytics.num_replicas', '0'

    systemProperty "https", System.getProperty("https")
    systemProperty "user", System.getProperty("user")
    systemProperty "password", System.getProperty("password")

    // Don't fail the build on test failures — failures are the report payload.
    ignoreFailures = true

    reports {
        junitXml.required.set(true)
        junitXml.outputLocation.set(file("$buildDir/test-results/analyticsCompatibility"))
        html.required.set(true)
        html.outputLocation.set(file("$buildDir/reports/tests/analyticsCompatibility"))
    }

    // PPL ITs only: both the calcite remote suite and the legacy ppl/ package.
    filter {
        includeTestsMatching "org.opensearch.sql.calcite.remote.*IT"
        includeTestsMatching "org.opensearch.sql.ppl.*IT"
    }

    // BWC, correctness, doctest and legacy oddballs aren't in scope for the analytics report.
    exclude 'org/opensearch/sql/bwc/**'
    exclude 'org/opensearch/sql/doctest/**/*IT.class'
    exclude 'org/opensearch/sql/correctness/**'
    exclude 'org/opensearch/sql/jdbc/**'
    exclude 'org/opensearch/sql/security/**'

    // Meta / admin ITs (explain, describe, system functions, settings, resource monitor,
    // concurrency) — currently kept IN the denominator on purpose so the headline number
    // stays honest. Revisit at end-of-project to claim a cleaner "query-path-only" pass rate.
    // Candidates: CalcitePPLExplainIT, CalciteExplainIT, CalciteDescribeCommandIT,
    // CalciteSystemFunctionIT, CalciteSettingsIT, CalciteResourceMonitorIT, PPLConcurrencyIT

    // Dedup pattern: many `Calcite<X>IT extends <X>IT` — the subclass inherits every parent
    // test method, so running both classes doubles the execution count. In the analytics-engine
    // compatibility context we force every PPL query through the analytics-engine path via the
    // cluster setting, so the two siblings traverse the identical code path and pass/fail in
    // lockstep. Drop the legacy parent class for every such pair to make each unique test method
    // contribute one entry, keeping the subclass since it also calls enableCalcite() in its
    // own init() (no harm — still routed to analytics).
    //
    // Built at configuration time by scanning the Calcite source tree for parent declarations
    // and confirming the parent's source file exists in the scope packages. Synthesized excludes
    // join the static excludes above.
    def calciteSrcRoot = file("$projectDir/src/test/java/org/opensearch/sql/calcite/remote")
    def scopePackages = ['org/opensearch/sql/ppl/', 'org/opensearch/sql/sql/']
    def dedupExcludes = []
    if (calciteSrcRoot.isDirectory()) {
        def parentExtractor = ~/^public class [A-Za-z]+IT extends ([A-Za-z]+)\b/
        fileTree(calciteSrcRoot) { include "**/Calcite*IT.java" }.each { f ->
            def parent = null
            f.eachLine { line ->
                if (parent == null) {
                    def m = parentExtractor.matcher(line)
                    if (m.find()) {
                        parent = m.group(1)
                    }
                }
            }
            if (parent != null && parent.endsWith('IT') && !parent.startsWith('Calcite')) {
                scopePackages.each { pkg ->
                    def candidate = file("$projectDir/src/test/java/${pkg}${parent}.java")
                    if (candidate.exists()) {
                        dedupExcludes << "${pkg}${parent}.class"
                    }
                }
            }
        }
    }
    dedupExcludes.unique().each { e ->
        exclude e
    }
    if (!dedupExcludes.isEmpty()) {
        logger.lifecycle("[analyticsCompatibilityTest] Dedup'd ${dedupExcludes.unique().size()} legacy parent IT classes whose Calcite subclass covers them.")
    }

    // The test task hits whatever cluster `-Dtests.rest.cluster=...` points at; no testClusters
    // dependency. Only run if the user supplied a cluster.
    onlyIf {
        if (System.getProperty("tests.rest.cluster") == null) {
            logger.lifecycle(
                    "[analyticsCompatibility] Skipping: pass -Dtests.rest.cluster=<host:port> " +
                            "(and optionally -Dtests.cluster=, -Dtests.clustername=) pointing at " +
                            "an externally-running cluster with the analytics-engine plugin set installed.")
            return false
        }
        return true
    }
}

